<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>ACCOUNT DETAILS | Cr@ckFlow</title>
  <meta name="description" content="Cr@ckFlow is a Digital Marketing Website">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:       #0b1426;
      --navy-mid:   #132040;
      --navy-light: #1c2e57;
      --gold:       #c9a84c;
      --gold-light: #e8c97a;
      --gold-pale:  #f5e8c0;
      --cream:      #f7f3ec;
      --white:      #ffffff;
      --muted:      #8a96b0;
      --border:     rgba(201,168,76,0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      background-image:
        radial-gradient(ellipse at 10% 20%, rgba(201,168,76,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 80%, rgba(28,46,87,0.8) 0%, transparent 60%);
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      color: var(--cream);
    }

    /* ── NAVBAR ── */
    .navbar {
      background: rgba(11,20,38,0.92) !important;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 2rem;
    }

    .navbar-brand img { width: 64px; filter: brightness(1.1); }

    .nav-link {
      font-family: 'Jost', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted) !important;
      text-transform: uppercase;
      transition: color 0.25s;
      padding: 0.5rem 1rem !important;
    }
    .nav-link:hover { color: var(--gold-light) !important; }
    .nav-link.active-page { color: var(--gold) !important; }

    .navbar-toggler { border-color: var(--border); }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28201,168,76,0.85%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* user dropdown */
    .dropdown-menu {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      min-width: 180px;
      padding: 0.4rem 0;
    }
    .dropdown-item {
      color: var(--cream) !important;
      font-size: 0.83rem;
      font-family: 'Jost', sans-serif;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.2s, color 0.2s;
    }
    .dropdown-item:hover {
      background: rgba(201,168,76,0.12) !important;
      color: var(--gold-light) !important;
    }
    .dropdown-item svg { opacity: 0.75; flex-shrink: 0; }

    /* gold divider line */
    .gold-rule {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0;
    }

    /* ── PAGE CONTENT ── */
    .page-wrapper {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .account-card {
      background: rgba(19,32,64,0.75);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.8rem 2.5rem;
      width: 100%;
      max-width: 520px;
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    /* decorative corner accent */
    .account-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 140px; height: 140px;
      background: radial-gradient(circle at top right, rgba(201,168,76,0.12), transparent 70%);
      pointer-events: none;
    }
    .account-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100px; height: 100px;
      background: radial-gradient(circle at bottom left, rgba(201,168,76,0.07), transparent 70%);
      pointer-events: none;
    }

    /* avatar circle */
    .avatar-wrap {
      text-align: center;
      margin-bottom: 2rem;
    }
    .avatar-circle {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy-light), var(--navy-mid));
      border: 2px solid var(--gold);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .avatar-circle i { font-size: 2rem; color: var(--gold); }

    .card-eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 0.3rem;
    }
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 500;
      color: var(--white);
      text-align: center;
      margin-bottom: 0.15rem;
      letter-spacing: 0.02em;
    }
    .card-subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 2.2rem;
    }

    /* field label + input */
    .field-group { margin-bottom: 1.4rem; }

    .field-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.45rem;
      display: block;
    }

    .field-input-wrap {
      position: relative;
    }
    .field-input-wrap .field-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      opacity: 0.6;
      font-size: 0.9rem;
    }
    .luxury-input {
      width: 100%;
      background: rgba(11,20,38,0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-size: 0.92rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      transition: border-color 0.25s, background 0.25s;
      outline: none;
    }
    .luxury-input:focus {
      border-color: rgba(201,168,76,0.6);
      background: rgba(11,20,38,0.85);
    }
    .luxury-input[readonly] { cursor: default; }

    /* gold shimmer divider */
    .card-divider {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border) 30%, var(--border) 70%, transparent);
      margin: 1.8rem 0;
    }

    /* CTA button */
    .btn-luxury {
      display: block;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: var(--navy) !important;
      font-family: 'Jost', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 0.5rem;
    }
    .btn-luxury:hover {
      opacity: 0.88;
      transform: translateY(-1px);
      text-decoration: none;
      color: var(--navy) !important;
    }
    .btn-luxury:active { transform: translateY(0); }

    /* status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 576px) {
      .account-card { padding: 2rem 1.5rem; }
      .card-title { font-size: 1.65rem; }
      .navbar { padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-sm navbar-dark mb-0">

      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ml-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5500/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5500/portfolio.html">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5500/blog.html">Blog</a></li>
        <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5500/pricing.html">Pricing</a></li>
        <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5500/contact.html">Contact</a></li>

          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
            <a class="dropdown-item" href="http://127.0.0.1:5500/accountdetais.html">

              Refer a Friend
            </a>
            <div style="height:1px; background: var(--border); margin: 0.3rem 0.8rem;"></div>

              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" class="bi bi-box-arrow-in-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/>
                <path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>

          </div>
        </li>
      </ul>
    </div>
  </nav>

  <hr class="gold-rule">

  <!-- MAIN CONTENT -->
  <div class="page-wrapper">
    <div class="account-card">

      <!-- Avatar + heading -->
      <div class="avatar-wrap">
        <div class="avatar-circle">
          <i class="fas fa-user"></i>
        </div>
        <div class="card-eyebrow">Member Profile</div>
        <h1 class="card-title">Account Details</h1>
        <p class="card-subtitle">Your personal information &amp; credentials</p>
        <div class="status-badge">
          <span class="status-dot"></span>
          Active Account
        </div>
      </div>

      <!-- Email field -->
      <div class="field-group">
        <label class="field-label" for="referralLink">Email Address</label>
        <div class="field-input-wrap">
          <i class="fas fa-envelope field-icon"></i>
          <input type="email" class="luxury-input" id="referralLink" value="" readonly placeholder="Loading...">
        </div>
      </div>

      <!-- Username field -->
      <div class="field-group">
        <label class="field-label" for="username">Username</label>
        <div class="field-input-wrap">
          <i class="fas fa-at field-icon"></i>
          <input type="text" class="luxury-input" id="username" value="" readonly placeholder="Loading...">
        </div>
      </div>

      <hr class="card-divider">

      <!-- CTA -->
      <a href="home.html" class="btn-luxury">
        <i class="fas fa-home mr-2" style="font-size:0.8rem;"></i>Return to Home
      </a>

    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/accountdetais.js"></script>
