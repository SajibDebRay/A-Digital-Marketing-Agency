<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>LOG IN|Cr@ckFlow</title>
    <meta name="description" content="Cr@ckFlow is a Digital Marketing Website">
    <meta property="og:description" content="Cr@ackFlow gives you the best">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    </head>
    <body class="d-flex justify-content-center align-items-center" style="background-color: rgb(203, 201, 198); ">
       <div class="container-md mt-4">
        <form class="form m-auto col-lg-6 col-md-8 col-11 text-center bg-white p-4 rounded" method="POST" action="/auth/login">
            <img src="Cr@ckFlow Logo.png" alt="logo" class="img-fluid" style="width: 90px;">
  <h1 class="text-primary">LOG IN</h1>
    <p class="mb-3">don't have any account?</p>
    <a href="http://127.0.0.1:5500/signup.html" class="m-4 d-block">sign up here</a>
 

  <div class="form-group">
    <input type="email" class="form-control form-control-lg mb-3 border-primary" id="email" placeholder="Email">
  </div>
  <div class="form-group">
    <input type="password" class="form-control form-control-lg mb-3 border-primary" id="password" placeholder="Password">
  </div>
 <div class="form-group d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="http://127.0.0.1:5500/vcode.html" class="text-primary">Forgot password?</a>
    </div>


  <div class="text-left">
    <button type="submit" class="btn btn-outline-success mb-3 mt-3">LOG IN</button>
    <button type="reset" class="btn btn-outline-primary mb-3 mt-3">CLEAR</button>
</div>
</form>
       </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
        </body>
</html>
