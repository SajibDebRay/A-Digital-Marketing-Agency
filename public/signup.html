<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>SIGN UP | Cr@ckFlow</title>
  <meta name="description" content="Cr@ckFlow is a Digital Marketing Website">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./signup.css">
</head>
<body>

  <div class="bg-deco">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="auth-card">

    <img src="Cr@ckFlow Logo.png" alt="Cr@ckFlow logo" class="auth-logo">

    <div class="auth-icon">
      <i class="fas fa-user-plus"></i>
    </div>

    <div class="auth-eyebrow">Join Cr@ckFlow</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Already have an account?</p>
    <a href="/auth/login" class="auth-login-link">Log in here →</a>

    <hr class="auth-divider">

    <form method="POST" action="/auth/signup" id="signupForm" novalidate>

      <!-- Username -->
      <label class="field-label" for="username">Username</label>
      <div class="input-wrap">
        <i class="fas fa-at input-icon"></i>
        <input
          type="text"
          name="username"
          class="luxury-input"
          id="username"
          placeholder="Choose a username"
          required>
        <div class="val-msg error" id="usernameError">
          <i class="fas fa-exclamation-circle"></i> Username must be at least 3 characters.
        </div>
      </div>

      <!-- Email -->
      <label class="field-label" for="email">Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input
          type="email"
          name="email"
          class="luxury-input"
          id="email"
          placeholder="you@example.com"
          required>
        <div class="val-msg error" id="emailError">
          <i class="fas fa-exclamation-circle"></i> Please enter a valid email address.
        </div>
      </div>

      <!-- Password -->
      <label class="field-label" for="password">Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input
          type="password"
          name="password"
          class="luxury-input"
          id="password"
          placeholder="Create a password"
          required>
        <button type="button" class="pw-toggle" id="togglePw" aria-label="Toggle password">
          <i class="fas fa-eye" id="iconPw"></i>
        </button>
        <!-- strength bar -->
        <div class="strength-wrap">
          <div class="strength-bar-bg">
            <div class="strength-bar-fill" id="strengthBar"></div>
          </div>
          <span class="strength-text" id="strengthText"></span>
        </div>
        <div class="val-msg error" id="passwordError">
          <i class="fas fa-exclamation-circle"></i> Password must be at least 8 characters.
        </div>
      </div>

      <!-- Confirm Password -->
      <label class="field-label" for="confirmPassword">Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input
          type="password"
          name="confirmPassword"
          class="luxury-input"
          id="confirmPassword"
          placeholder="Re-enter your password"
          required>
        <button type="button" class="pw-toggle" id="toggleConfirm" aria-label="Toggle confirm password">
          <i class="fas fa-eye" id="iconConfirm"></i>
        </button>
        <div class="val-msg error" id="matchError">
          <i class="fas fa-times-circle"></i> Passwords do not match.
        </div>
        <div class="val-msg success" id="matchSuccess">
          <i class="fas fa-check-circle"></i> Passwords match.
        </div>
      </div>

      <!-- Terms -->
      <div class="terms-row">
        <input type="checkbox" id="terms" required>
        <label class="terms-text" for="terms">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of Cr@ckFlow.
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-auth-primary">
        <i class="fas fa-user-plus" style="font-size:0.72rem;"></i> Create Account
      </button>

      <div class="or-divider"><span class="or-text">or</span></div>

      <button type="reset" class="btn-auth-outline" id="clearBtn">
        <i class="fas fa-times" style="font-size:0.72rem;"></i> Clear Fields
      </button>

    </form>

    <p class="auth-note">
      <i class="fas fa-lock"></i> Your data is encrypted and will never be sold or shared.
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ── show/hide toggles ── */
    function makeToggle(btnId, inputId, iconId) {
      document.getElementById(btnId).addEventListener('click', function () {
        var inp  = document.getElementById(inputId);
        var icon = document.getElementById(iconId);
        if (inp.type === 'password') {
          inp.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          inp.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    }
    makeToggle('togglePw',      'password',        'iconPw');
    makeToggle('toggleConfirm', 'confirmPassword', 'iconConfirm');

    /* ── username validation ── */
    var usernameInput = document.getElementById('username');
    var usernameErr   = document.getElementById('usernameError');
    usernameInput.addEventListener('input', function () {
      if (usernameInput.value.length > 0 && usernameInput.value.length < 3) {
        usernameInput.classList.add('input-error');
        usernameErr.classList.add('show');
      } else {
        usernameInput.classList.remove('input-error');
        usernameErr.classList.remove('show');
      }
    });

    /* ── email validation ── */
    var emailInput = document.getElementById('email');
    var emailErr   = document.getElementById('emailError');
    emailInput.addEventListener('input', function () {
      var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
      if (emailInput.value.length > 0 && !valid) {
        emailInput.classList.add('input-error');
        emailErr.classList.add('show');
      } else {
        emailInput.classList.remove('input-error');
        emailErr.classList.remove('show');
      }
    });

    /* ── password strength ── */
    var pwInput     = document.getElementById('password');
    var bar         = document.getElementById('strengthBar');
    var barText     = document.getElementById('strengthText');
    var passwordErr = document.getElementById('passwordError');

    pwInput.addEventListener('input', function () {
      var val = pwInput.value;
      var score = 0;
      if (val.length >= 8)           score++;
      if (/[A-Z]/.test(val))         score++;
      if (/[0-9]/.test(val))         score++;
      if (/[^A-Za-z0-9]/.test(val))  score++;

      var pct   = ['0%','25%','50%','75%','100%'][score];
      var color = ['transparent','#e07070','#e8c97a','#c9a84c','#50c878'][score];
      var label = ['','Weak','Fair','Good','Strong'][score];

      bar.style.width      = pct;
      bar.style.background = color;
      barText.textContent  = label;
      barText.style.color  = color;

      if (val.length > 0 && val.length < 8) {
        pwInput.classList.add('input-error');
        passwordErr.classList.add('show');
      } else {
        pwInput.classList.remove('input-error');
        passwordErr.classList.remove('show');
      }
      checkMatch();
    });

    /* ── match validation ── */
    var confirmInput = document.getElementById('confirmPassword');
    var matchErr     = document.getElementById('matchError');
    var matchOk      = document.getElementById('matchSuccess');

    function checkMatch() {
      var a = pwInput.value;
      var b = confirmInput.value;
      if (b.length === 0) {
        confirmInput.classList.remove('input-error', 'input-success');
        matchErr.classList.remove('show');
        matchOk.classList.remove('show');
        return;
      }
      if (a === b) {
        confirmInput.classList.remove('input-error');
        confirmInput.classList.add('input-success');
        matchErr.classList.remove('show');
        matchOk.classList.add('show');
      } else {
        confirmInput.classList.remove('input-success');
        confirmInput.classList.add('input-error');
        matchOk.classList.remove('show');
        matchErr.classList.add('show');
      }
    }
    confirmInput.addEventListener('input', checkMatch);

    /* ── clear reset ── */
    document.getElementById('clearBtn').addEventListener('click', function () {
      bar.style.width = '0%';
      barText.textContent = '';
      [usernameInput, emailInput, pwInput, confirmInput].forEach(function (el) {
        el.classList.remove('input-error', 'input-success');
      });
      [usernameErr, emailErr, passwordErr, matchErr, matchOk].forEach(function (el) {
        el.classList.remove('show');
      });
    });
  </script>
</body>
</html>
