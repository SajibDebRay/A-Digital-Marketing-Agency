<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SIGN UP|Cr@ckFlow</title>
    <meta name="description" content="Cr@ckFlow is a Digital Marketing Website">
    <meta property="og:description" content="Cr@ackFlow gives you the best">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    </head>
    <body class="d-flex justify-content-center align-items-center" style="background-color: rgb(203, 201, 198); ">
       <div class="container-md mt-3">
        <form class="form m-auto col-lg-6 col-md-8 col-11 text-center bg-white p-4 rounded" method="POST" action="/auth/signup">
    <img src="Cr@ckFlow Logo.png" alt="logo" class="img-fluid" style="width: 90px;">
    <h1 class="text-primary">SIGN UP</h1>
    <p class="mb-3">Already have an account?</p>
    <a href="/login" class="m-4 d-block">Log in here</a>

    <div class="form-group">
        <input type="text" name="username" class="form-control form-control-lg mb-3 border-primary" placeholder="Username" required>
    </div>
    <div class="form-group">
        <input type="email" name="email" class="form-control form-control-lg mb-3 border-primary" placeholder="Email" required>
    </div>
    <div class="form-group">
        <input type="password" name="password" class="form-control form-control-lg mb-3 border-primary" placeholder="Password" required>
    </div>
    <div class="form-group">
        <input type="password" name="confirmPassword" class="form-control form-control-lg mb-3 border-primary" placeholder="Confirm Password" required>
    </div>

    <div class="text-left">
        <button type="submit" class="btn btn-outline-success mb-3 mt-3">Sign Up</button>
        <button type="reset" class="btn btn-outline-primary mb-3 mt-3">CLEAR</button>
    </div>
</form>

       </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
        </body>
</html>
