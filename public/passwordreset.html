<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Password Reset | Cr@ckFlow</title>
  <meta name="description" content="Cr@ckFlow is a Digital Marketing Website">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./passwordreset.css">
</head>
<body>

  <!-- background decoration -->
  <div class="bg-deco">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="auth-card">

    <img src="Cr@ckFlow Logo.png" alt="Cr@ckFlow logo" class="auth-logo">

    <div class="auth-icon">
      <i class="fas fa-key"></i>
    </div>

    <div class="auth-eyebrow">Account Security</div>
    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-subtitle">Choose a strong new password to keep your account secure.</p>

    <hr class="auth-divider">

    <form id="resetForm" novalidate>

      <!-- New Password -->
      <div class="field-group">
        <label class="field-label" for="newPassword">New Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input
            type="password"
            class="luxury-input"
            id="newPassword"
            placeholder="Enter new password"
            required>
          <button type="button" class="pw-toggle" id="toggleNew" aria-label="Toggle password">
            <i class="fas fa-eye" id="iconNew"></i>
          </button>
        </div>
        <!-- strength bar -->
        <div class="strength-wrap">
          <div class="strength-bar-bg">
            <div class="strength-bar-fill" id="strengthBar"></div>
          </div>
          <span class="strength-text" id="strengthText"></span>
        </div>
        <div class="val-msg error" id="newPwError">
          <i class="fas fa-exclamation-circle"></i> Password must be at least 8 characters.
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field-group">
        <label class="field-label" for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input
            type="password"
            class="luxury-input"
            id="confirmPassword"
            placeholder="Re-enter your password"
            required>
          <button type="button" class="pw-toggle" id="toggleConfirm" aria-label="Toggle password">
            <i class="fas fa-eye" id="iconConfirm"></i>
          </button>
        </div>
        <div class="val-msg error" id="matchError">
          <i class="fas fa-times-circle"></i> Passwords do not match.
        </div>
        <div class="val-msg success" id="matchSuccess">
          <i class="fas fa-check-circle"></i> Passwords match.
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-auth-primary">
        <i class="fas fa-check" style="font-size:0.72rem;"></i> Confirm Password
      </button>

      <div class="or-divider"><span class="or-text">or</span></div>

      <button type="reset" class="btn-auth-outline" id="clearBtn">
        <i class="fas fa-times" style="font-size:0.72rem;"></i> Clear Fields
      </button>

    </form>

    <a href="http://127.0.0.1:5500/enteremail.html" class="auth-back">
      <i class="fas fa-arrow-left"></i> Back to verification
    </a>

    <p class="auth-note">
      <i class="fas fa-shield-alt"></i> Your new password will be encrypted and stored securely.
    </p>

  </div>

  <script src="/js/pass.js"></script>
  <script src="/js/passwordreset.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ── show/hide toggles ── */
    function makeToggle(btnId, inputId, iconId) {
      document.getElementById(btnId).addEventListener('click', function () {
        var inp  = document.getElementById(inputId);
        var icon = document.getElementById(iconId);
        if (inp.type === 'password') {
          inp.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          inp.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    }
    makeToggle('toggleNew',     'newPassword',     'iconNew');
    makeToggle('toggleConfirm', 'confirmPassword', 'iconConfirm');

    /* ── password strength ── */
    var newPw     = document.getElementById('newPassword');
    var bar       = document.getElementById('strengthBar');
    var barText   = document.getElementById('strengthText');
    var newPwErr  = document.getElementById('newPwError');

    newPw.addEventListener('input', function () {
      var val = newPw.value;
      var score = 0;
      if (val.length >= 8)  score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      var pct    = ['0%','25%','50%','75%','100%'][score];
      var color  = ['transparent','#e07070','#e8c97a','#c9a84c','#50c878'][score];
      var label  = ['','Weak','Fair','Good','Strong'][score];

      bar.style.width      = pct;
      bar.style.background = color;
      barText.textContent  = label;
      barText.style.color  = color;

      /* min length validation */
      if (val.length > 0 && val.length < 8) {
        newPw.classList.add('input-error');
        newPwErr.classList.add('show');
      } else {
        newPw.classList.remove('input-error');
        newPwErr.classList.remove('show');
      }
      checkMatch();
    });

    /* ── match validation ── */
    var confirmPw   = document.getElementById('confirmPassword');
    var matchErr    = document.getElementById('matchError');
    var matchOk     = document.getElementById('matchSuccess');

    function checkMatch() {
      var a = newPw.value;
      var b = confirmPw.value;
      if (b.length === 0) {
        confirmPw.classList.remove('input-error','input-success');
        matchErr.classList.remove('show');
        matchOk.classList.remove('show');
        return;
      }
      if (a === b) {
        confirmPw.classList.remove('input-error');
        confirmPw.classList.add('input-success');
        matchErr.classList.remove('show');
        matchOk.classList.add('show');
      } else {
        confirmPw.classList.remove('input-success');
        confirmPw.classList.add('input-error');
        matchOk.classList.remove('show');
        matchErr.classList.add('show');
      }
    }
    confirmPw.addEventListener('input', checkMatch);

    /* ── clear reset ── */
    document.getElementById('clearBtn').addEventListener('click', function () {
      bar.style.width = '0%';
      barText.textContent = '';
      [newPw, confirmPw].forEach(function(el) {
        el.classList.remove('input-error','input-success');
      });
      [newPwErr, matchErr, matchOk].forEach(function(el) {
        el.classList.remove('show');
      });
    });
  </script>
</body>
</html>
